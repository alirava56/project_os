name: ProjectOS verification
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:core
      - run: npm audit --audit-level=high
      - run: npm run build
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Windows'
        run: npx playwright install chromium
      - run: npm run test:smoke
      - if: runner.os == 'Linux'
        run: npm run test:workflows
      - if: runner.os == 'Windows'
        run: npm run test:workflows -- --workers=1

  postgres-migration-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectos_test
          POSTGRES_PASSWORD: projectos-ci-disposable-fixture
        options: >-
          --health-cmd "pg_isready -U projectos_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      PROJECTOS_TEST_POSTGRES_URL: postgresql://projectos_test:projectos-ci-disposable-fixture@127.0.0.1:5432/postgres
      PROJECTOS_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci --include=optional
      - run: npm run test:postgres
      - run: npm run build
      - run: npm run test:postgres-http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:project-lifecycle
      - run: npm run test:postgres-browser -- --browser=chromium

  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: projectos_test
          POSTGRES_PASSWORD: projectos-ci-disposable-fixture
        options: >-
          --health-cmd "pg_isready -U projectos_test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      PROJECTOS_TEST_POSTGRES_URL: postgresql://projectos_test:projectos-ci-disposable-fixture@127.0.0.1:5432/postgres
      PROJECTOS_PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=optional
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Create loopback TLS fixture
        run: |
          fixture_dir="$RUNNER_TEMP/projectos-tls"
          mkdir -p "$fixture_dir"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=127.0.0.1 \
            -addext 'subjectAltName=IP:127.0.0.1' -keyout "$fixture_dir/loopback.key" -out "$fixture_dir/loopback.crt"
          echo "PROJECTOS_TEST_TLS_KEY=$fixture_dir/loopback.key" >> "$GITHUB_ENV"
          echo "PROJECTOS_TEST_TLS_CERT=$fixture_dir/loopback.crt" >> "$GITHUB_ENV"
      - run: npm run test:postgres-browser -- --browser=${{ matrix.browser }}

  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
